<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // نفس منطق قراءة الثيم بالضبط المستخدم في index.html الرئيسي، لضمان تطابق تام
    (function () {
      var theme = localStorage.getItem("expense-manager-theme");
      if (theme !== "light" && theme !== "dark") theme = "dark";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root[data-theme="dark"] {
      --bg: #0F1B2D; --text: #E6EDF5; --text-muted: #8AA0BD; --accent: #4DA3FF; --accent-soft: rgba(77,163,255,0.15);
    }
    :root[data-theme="light"] {
      --bg: #F4F6FA; --text: #1A2433; --text-muted: #64748B; --accent: #2D7DF6; --accent-soft: rgba(45,125,246,0.10);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: var(--bg); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; gap: 18px;
      animation: fadeIn 0.35s ease both;
    }
    .logo-box {
      width: 72px; height: 72px; border-radius: 20px; background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .logo-svg { width: 38px; height: 38px; }
    .app-name {
      color: var(--text); font-size: 16px; font-weight: 700; letter-spacing: 0.3px;
    }
    .dots { display: flex; gap: 6px; margin-top: 4px; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      opacity: 0.3; animation: dotPulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-box, .dot { animation: none; }
      .container { animation: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <svg class="logo-svg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect x="95"  y="302" width="110" height="175" rx="24" fill="#3A8FF8" opacity="0.92"/>
        <rect x="201" y="212" width="110" height="265" rx="24" fill="#3A8FF8"/>
        <rect x="307" y="122" width="110" height="355" rx="24" fill="#64BCFF"/>
        <circle cx="362" cy="97" r="16" fill="white" opacity="0.9"/>
      </svg>
    </div>
    <div class="app-name">Expense Manager</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
