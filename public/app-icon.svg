<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    أيقونة Expense Manager — محفظة بألوان هوية التطبيق نفسها:
      الخلفية  : ليل أزرق (#1E2A38 → #101720) نفس عائلة --bg
      المحفظة  : teal (#4FC4A7 → #2D8570) نفس --accent / --accent-strong
      النقطة   : مرجاني (#ED7354) نفس --coral، لون التأكيد في التطبيق
      الورقة   : (#F2EEE3) نفس --text في الوضع الداكن

    الإحداثيات هنا مطابقة لـ tools/generate_icons.py — أي تعديل هنا
    لازم يتكرّر هناك ثم تُعاد الأيقونات بـ: python tools/generate_icons.py
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2A38"/>
      <stop offset="100%" stop-color="#101720"/>
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC4A7"/>
      <stop offset="100%" stop-color="#2D8570"/>
    </linearGradient>
    <radialGradient id="shineGrad" cx="22%" cy="16%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
    <clipPath id="walletClip">
      <rect x="96" y="168" width="320" height="232" rx="52" ry="52"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <g clip-path="url(#roundedClip)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>
    <rect width="512" height="512" fill="url(#shineGrad)"/>

    <!-- ورقة نقدية خارجة من المحفظة -->
    <g>
      <rect x="150" y="104" width="212" height="110" rx="26" fill="#F2EEE3" fill-opacity="0.93"/>
      <rect x="178" y="136" width="90" height="16" rx="8" fill="#161D27" fill-opacity="0.24"/>
      <rect x="178" y="166" width="50" height="16" rx="8" fill="#161D27" fill-opacity="0.16"/>
    </g>

    <!-- ظل ناعم تحت المحفظة -->
    <rect x="104" y="186" width="304" height="222" rx="52" fill="#000000" fill-opacity="0.47" filter="url(#softShadow)"/>

    <!-- جسم المحفظة -->
    <rect x="96" y="168" width="320" height="232" rx="52" fill="url(#walletGrad)"/>
    <g clip-path="url(#walletClip)">
      <rect x="96" y="168" width="320" height="72" rx="52" fill="#FFFFFF" fill-opacity="0.13"/>
    </g>

    <!-- جيب القفل + النقطة المرجانية -->
    <rect x="288" y="248" width="112" height="80" rx="40" fill="#161D27"/>
    <circle cx="356" cy="288" r="26" fill="#ED7354"/>

    <rect x="3" y="3" width="506" height="506" rx="113" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  </g>
</svg>
